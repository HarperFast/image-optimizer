type Image @table(database: "ImageOptimization") @sealed @export(name: "images") {
	id: ID! @primaryKey
	blob: Blob
	contentType: String
	createdAt: Date
	updatedAt: Date
}

type ImageVariant @table(database: "ImageOptimization", expiration: 3600) @sealed @export(name: "image_variants") {
	id: ID! @primaryKey
	imageId: String @indexed
	format: String @indexed
	width: Int @indexed
	dpr: Float
	blob: Blob,
  	contentType: String
	createdAt: Date
	updatedAt: Date
}
