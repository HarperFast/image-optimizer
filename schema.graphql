type Image @table(database: "ImageOptimization") @sealed @export(name: "images") {
  id: ID! @primaryKey
  blob: Blob
  contentType: String
  createdAt: Date
}

type ImageVariant @table(database: "ImageOptimization") @sealed @export(name: "image_variants") {
  id: ID! @primaryKey
  imageId: String @indexed
  format: String @indexed
  width: Int @indexed
  dpr: Float
  blob: Blob
  createdAt: Date
}