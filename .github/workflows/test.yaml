name: Run Tests

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from package.json
        id: nvm
        run: echo "NODE_VERSION=$(jq -r '.engines.node' package.json)" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Harper CLI
        run: npm install -g harperdb

      - name: Setup Harper
        env:
          DEFAULTS_MODE: 'dev'
          TC_AGREEMENT: 'yes'
          HDB_ADMIN_USERNAME: 'admin'
          HDB_ADMIN_PASSWORD: 'password'
          ROOTPATH: '/tmp/hdb'
          OPERATIONSAPI_NETWORK_PORT: 9925
          REPLICATION_HOSTNAME: 'localhost'
          LOGGING_LEVEL: 'debug'
          LOGGING_STDSTREAMS: true
          THREADS_COUNT: 1
          THREADS_DEBUG: false
        run: harperdb install

      - name: Build
        run: npm run build

      - name: Start HarperDB
        run: |
          harperdb start
          sleep 10

      - name: Deploy Application
        run: |
          harperdb deploy project=image-optimizer restart=true
          sleep 10

      - name: Restart HarperDB
        run: |
          curl -u admin:password \
            -H "Content-Type: application/json" \
            -d '{"operation":"restart"}' \
            http://localhost:9925

      - name: Run tests
        env:
          HDB_HOST: 'localhost'
          HDB_PORT: '9925'
          HDB_USERNAME: 'admin'
          HDB_PASSWORD: 'password'
        run: npm test

      - name: Upload HarperDB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harperdb-logs
          path: /tmp/hdb/log/hdb.log
          retention-days: 7

      - name: Stop HarperDB
        if: always()
        run: harperdb stop
